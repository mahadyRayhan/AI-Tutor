<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password — SAGE</title>
  <link rel="stylesheet" href="/static/css/auth.css?v=1">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh;
           background:#0f1115; color:#e2e8f0; font-family:Inter,system-ui,sans-serif; margin:0; }
    .card { width:min(420px,92vw); background:#171a21; border:1px solid #262b36;
            border-radius:14px; padding:2rem; }
    h1 { font-size:1.25rem; margin:0 0 .35rem; }
    p.sub { color:#94a3b8; font-size:.9rem; margin:0 0 1.5rem; }
    label { display:block; font-size:.8rem; color:#94a3b8; margin:1rem 0 .35rem; }
    input { width:100%; box-sizing:border-box; padding:.7rem .8rem; border-radius:8px;
            border:1px solid #2c323d; background:#0f1115; color:#e2e8f0; font-size:.95rem; }
    button { width:100%; margin-top:1.4rem; padding:.75rem; border:0; border-radius:8px;
             background:#3b82f6; color:#fff; font-weight:600; font-size:.95rem; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .msg { margin-top:1rem; font-size:.88rem; min-height:1.2em; }
    .err { color:#f87171; } .ok { color:#34d399; }
    a { color:#60a5fa; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="sub">Your reset link is valid for one use.</p>

    <form id="form" onsubmit="return false;">
      <label for="pw">New password</label>
      <input type="password" id="pw" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" autocomplete="new-password" placeholder="Re-enter it">
      <button id="btn" type="submit">Set new password</button>
    </form>

    <div class="msg" id="msg"></div>
    <p style="margin-top:1.2rem"><a href="/index.html">Back to sign in</a></p>
  </div>

<script>
const token = new URLSearchParams(location.search).get('token');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

if (!token) {
    msg.className = 'msg err';
    msg.textContent = 'This link is missing its token. Request a new reset email.';
    btn.disabled = true;
}

document.getElementById('form').addEventListener('submit', async () => {
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    msg.className = 'msg';
    msg.textContent = '';

    if (pw !== pw2) {
        msg.className = 'msg err';
        msg.textContent = 'The two passwords do not match.';
        return;
    }

    btn.disabled = true;
    try {
        const res = await fetch('/api/v1/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: pw })
        });
        const data = await res.json();
        if (!res.ok) {
            // The server carries the specific reason (expired, reused, too weak).
            msg.className = 'msg err';
            msg.textContent = data.detail || 'Could not reset the password.';
            btn.disabled = false;
            return;
        }
        msg.className = 'msg ok';
        msg.textContent = `Password updated for ${data.username}. Redirecting to sign in…`;
        setTimeout(() => location.href = '/index.html', 1800);
    } catch (e) {
        msg.className = 'msg err';
        msg.textContent = 'Network error. Please try again.';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
