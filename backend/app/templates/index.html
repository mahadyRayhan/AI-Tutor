<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        window.mermaid = mermaid;
    </script>

    <style>
        :root {
            /* Bespoke Educational Product Palette */
            --bg-color: #0f1115;
            --sidebar-bg: #161920;
            --sidebar-hover: #1e2330;
            --input-bg: #1a1e28;
            --text-primary: #e2e8f0;
            --text-secondary: #a8c7fa;
            --text-muted: #94a3b8;
            --accent-color: #a8c7fa;
            --user-msg-bg: #1e293b;
            --bot-msg-bg: transparent;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            -webkit-font-smoothing: antialiased;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: width 0.3s ease;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
            border: none;
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background: #282a2c;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--sidebar-hover);
        }

        .new-chat-btn svg {
            width: 18px;
            fill: currentColor;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 3px;
            cursor: pointer;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .history-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .history-item:hover {
            background: var(--sidebar-hover);
            color: var(--text-primary);
        }

        .history-item.active {
            background: rgba(168, 199, 250, 0.08);
            border-left-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* Delete Button (Hidden by default, shown on hover) */
        .delete-chat-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: 8px;
        }

        .delete-chat-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 255, 255, 0.1);
        }

        .history-item:hover .delete-chat-btn {
            opacity: 1;
        }

        /* --- AUTH SCREEN --- */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-card {
            background: var(--sidebar-bg);
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .auth-card h2 {
            margin-top: 0;
            color: var(--text-primary);
            font-weight: 400;
        }

        .auth-input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
            font-size: 1rem;
        }

        .toggle-link {
            color: var(--accent-color);
            cursor: pointer;
            margin-top: 20px;
            display: block;
            font-size: 0.9rem;
        }

        .error-msg {
            color: #ff897d;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .hidden {
            display: none;
        }

        /* --- APP LAYOUT --- */
        #app-screen {
            display: none;
            width: 100%;
            height: 100%;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .content-row {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* --- CHAT SECTION --- */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }

        /* Top Bar */
        .top-bar {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 200;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 56px;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .role-badge {
            font-size: 0.75rem;
            background: #333;
            color: #aaa;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 15px;
        }

        /* Welcome View */
        #welcome-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            /* Passes clicks through the invisible background */
        }

        #welcome-view .suggestions-area {
            pointer-events: auto;
            /* Restores clicking specifically for the buttons */
            z-index: 15;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .welcome-text {
            font-size: 3.5rem;
            font-weight: 500;
            margin: 0;
            background: linear-gradient(90deg, #4285F4, #9B72CB, #F889A7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-welcome {
            font-size: 1.5rem;
            color: #555;
            margin-top: 10px;
            font-weight: 400;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            padding: 20px 6%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 120px;
            z-index: 10;
            /* Must be higher than the background */
            pointer-events: none;
        }

        .message {
            max-width: 95%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.7;
            font-size: 0.95rem;
            color: var(--text-primary);
            pointer-events: auto;
            animation: fadeSlideIn 0.3s ease-out both;
        }

        .msg-sender {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .msg-sender.bot {
            color: var(--accent-color);
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border: 1px solid rgba(168, 199, 250, 0.1);
            border-bottom-right-radius: 4px;
            max-width: 75%;
        }

        .message.bot {
            align-self: flex-start;
            background-color: transparent;
            padding-left: 0;
        }

        .message.bot strong {
            color: var(--accent-color);
            font-weight: 600;
        }

        .message.bot em {
            color: #c4a8ff;
            font-style: italic;
        }

        .message.bot h1,
        .message.bot h2,
        .message.bot h3,
        .message.bot h4,
        .message.bot h5 {
            color: #f0f0f0;
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .message.bot a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .message.bot a:hover {
            border-bottom-color: var(--accent-color);
        }

        .message.bot code:not([class*="language-"]) {
            background: rgba(168, 199, 250, 0.1);
            color: #c4dafb;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message.bot ul,
        .message.bot ol {
            padding-left: 20px;
        }

        .message.bot li {
            margin-bottom: 4px;
        }

        .message.bot li::marker {
            color: var(--accent-color);
        }

        .message.bot blockquote {
            border-left: 3px solid #1abc9c;
            margin: 12px 0;
            padding: 8px 14px;
            background: rgba(26, 188, 156, 0.06);
            border-radius: 0 8px 8px 0;
            color: #ccc;
        }

        /* Code Blocks — VS Code inspired */
        pre[class*="language-"] {
            background: #0d1117 !important;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin: 16px 0;
            padding: 16px !important;
            position: relative;
        }

        pre[class*="language-"]::before {
            content: attr(data-lang);
            position: absolute;
            top: 0;
            right: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-family: 'Inter', sans-serif;
            padding: 2px 8px;
            border-radius: 0 0 6px 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        code {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.88rem;
        }

        .input-wrapper {
            position: absolute;
            bottom: 30px;
            left: 15%;
            right: 15%;
            background: var(--input-bg);
            border-radius: 24px;
            padding: 10px 20px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--border-hover);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 12px 0;
            resize: none;
            max-height: 150px;
            outline: none;
            font-family: inherit;
        }

        .send-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            color: var(--text-secondary);
        }

        .send-icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Suggestions */
        .suggestions-area {
            position: absolute;
            bottom: 150px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 15;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .suggestion-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .suggestion-chip:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        /* Resources Side (Collapsible) */
        .resources-section {
            width: 350px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: width 0.3s ease, padding 0.3s ease, border 0.3s ease;
            overflow: hidden;
            flex-shrink: 0;
        }

        .res-header {
            padding: 20px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .sources-list {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .source-card {
            background: #2a2b2d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid transparent;
        }

        .source-card:hover {
            border-color: #555;
        }

        .source-title {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        .source-content {
            font-size: 0.85rem;
            color: #ddd;
        }

        /* --- Fix overflow inside source cards --- */
        .source-card {
            overflow: hidden;
        }

        .source-content {
            max-width: 100%;
            overflow-x: auto;
            box-sizing: border-box;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .source-content pre {
            margin: 0;
            max-width: 100%;
            overflow-x: auto;
            white-space: pre;
            box-sizing: border-box;
        }

        .source-content code {
            display: block;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* this adds an option to toggle the resources and context menu */
        /* Header layout (so title + button can sit on one row) */
        .res-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Small icon button for collapsing panels */
        .panel-toggle-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            border-radius: 10px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .panel-toggle-btn:hover {
            border-color: rgba(255, 255, 255, 0.35);
            color: #fff;
        }

        /* Collapse the right resources panel on desktop */
        body.hide-resources .resources-section {
            width: 0 !important;
            min-width: 0 !important;
            padding: 0 !important;
            border-left: none !important;
            overflow: hidden !important;
        }

        /* Hide the text and list on desktop collapse */
        body.hide-resources .res-header,
        body.hide-resources .sources-list {
            display: none !important;
        }

        body.hide-resources .resources-section * {
            pointer-events: none;
        }

        /* Top Bar Toggle Button (visible on all screen sizes) */
        .top-toggle {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        .top-toggle:hover {
            border-color: rgba(255, 255, 255, 0.35);
            color: #fff;
        }


        /* Progress Bar */
        .progress-step-container {
            background: #333;
            border-radius: 8px;
            padding: 10px;
            width: 250px;
        }

        .progress-step-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #aaa;
        }

        .progress-step-track {
            height: 4px;
            background: #555;
            border-radius: 2px;
            margin-top: 5px;
        }

        .progress-step-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        /* BOT SUGGESTION CHIPS (New) */
        .bot-suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .suggestion-btn {
            background: #2a2b2d;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .suggestion-btn:hover {
            background: #333;
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .suggestion-btn.challenge {
            border-color: #e67e22;
            color: #e67e22;
        }

        .suggestion-btn.challenge:hover {
            background: rgba(230, 126, 34, 0.1);
        }

        .loading-container {
            width: 100%;
            max-width: 600px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* The Status Text (e.g. "Reading documents...") */
        .loading-status {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.5s ease;
        }

        /* The Spinner Icon */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(168, 199, 250, 0.3);
            border-top: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* The "Ghost" Lines (Skeleton Text) */
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: #2a2b2d;
            background-image: linear-gradient(90deg,
                    #2a2b2d 0%,
                    #333 50%,
                    #2a2b2d 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .feedback-bar {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0.9;
        }

        .feedback-bar:hover {
            opacity: 1;
        }

        .feedback-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .feedback-btn:hover {
            background: rgba(168, 199, 250, 0.15);
            border-color: rgba(168, 199, 250, 0.3);
            color: var(--accent-color);
        }

        .feedback-btn.active {
            background: rgba(52, 211, 153, 0.15);
            border-color: rgba(52, 211, 153, 0.3);
            color: var(--success-color);
        }

        .feedback-btn.active.downvote {
            background: rgba(248, 113, 113, 0.15);
            border-color: rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        /* Different widths to look like real text paragraphs */
        .w-100 {
            width: 100%;
        }

        .w-80 {
            width: 80%;
        }

        .w-60 {
            width: 60%;
        }

        /* Animations */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {

            /* Right panel hidden by default on mobile */
            .resources-section {
                position: absolute;
                right: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                box-shadow: -2px 0 10px rgba(0, 0, 0, 0.5);
                transform: translateX(100%);
                transition: transform 0.3s ease;
                width: 320px;
                max-width: 85%;
                background: var(--sidebar-bg);
            }

            /* Show the resources panel when toggled on mobile */
            body.show-resources-mobile .resources-section {
                transform: translateX(0) !important;
                width: 320px !important;
                min-width: 320px !important;
                overflow: visible !important;
            }

            body.show-resources-mobile .resources-section * {
                pointer-events: auto !important;
            }

            body.show-resources-mobile .res-header,
            body.show-resources-mobile .sources-list {
                display: block !important;
            }

            body.show-resources-mobile .res-header {
                display: flex !important;
            }

            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100%;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 280px;
                max-width: 85%;
                background: var(--sidebar-bg);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            /* Dimmed background overlay when sidebar is open */
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 99;
                display: none;
            }

            .sidebar-overlay.open {
                display: block;
            }

            .input-wrapper {
                left: 5%;
                right: 5%;
                bottom: 20px;
            }

            .messages-container {
                padding: 20px 5%;
                padding-bottom: 100px;
            }

            .welcome-text {
                font-size: 2.8rem;
            }

            .sub-welcome {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 30px 20px;
            }

            .sidebar {
                width: 280px;
                max-width: 85%;
            }

            .input-wrapper {
                left: 10px;
                right: 10px;
                bottom: 10px;
                padding: 8px 15px;
            }

            textarea {
                font-size: 0.95rem;
                max-height: 100px;
            }

            .welcome-text {
                font-size: 2.2rem;
            }

            .sub-welcome {
                font-size: 1.1rem;
            }

            #dynamicGreeting {
                font-size: 1rem !important;
            }

            .suggestion-chip {
                padding: 10px 16px;
                font-size: 0.85rem;
            }

            .messages-container {
                padding-bottom: 80px;
            }

            .message {
                max-width: 100%;
            }

            .top-bar {
                padding: 10px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <!-- Login Form -->
        <div class="auth-card" id="loginForm">
            <h2>👋 Welcome Back</h2>
            <input type="text" id="loginUser" class="auth-input" placeholder="Username">
            <input type="password" id="loginPass" class="auth-input" placeholder="Password">
            <button class="auth-btn" onclick="performLogin()">Log In</button>
            <div class="toggle-link" onclick="toggleAuth('signup')">Create an account</div>
            <div class="error-msg" id="loginError"></div>
        </div>
        <!-- Signup Form (Same as before) -->
        <div class="auth-card hidden" id="signupForm">
            <h2>🚀 Create Account</h2>
            <input type="text" id="signName" class="auth-input" placeholder="Full Name">
            <input type="email" id="signEmail" class="auth-input" placeholder="Email">
            <input type="text" id="signUser" class="auth-input" placeholder="Username">
            <input type="password" id="signPass" class="auth-input" placeholder="Password">

            <!-- Optional Fields (Ensure IDs match JS) -->
            <input type="text" id="signUni" class="auth-input" placeholder="University (Optional)">
            <input type="text" id="signDept" class="auth-input" placeholder="Department (Optional)">
            <input type="text" id="signInterest" class="auth-input" placeholder="Topic of Interest (Optional)">

            <button class="auth-btn" onclick="performSignup()">Sign Up</button>
            <div class="toggle-link" onclick="toggleAuth('login')">Back to Login</div>
            <div class="error-msg" id="signupError"></div>
            <div class="success-msg" id="signupSuccess"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen">
        <div class="main-container">

            <!-- TOP BAR (spans full width above everything) -->
            <div class="top-bar">
                <div style="display:flex; align-items:center">
                    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    <span id="roleBadge" class="role-badge">STUDENT</span>
                </div>
                <div>
                    <button class="top-toggle" onclick="toggleResources()" title="Toggle sources">📚</button>
                    <button class="nav-btn" onclick="openDashboard()">Dashboard</button>
                    <button class="nav-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- CONTENT ROW: sidebar + chat + resources -->
            <div class="content-row">
                <!-- SIDEBAR -->
                <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
                <div class="sidebar" id="sidebar">
                    <button class="new-chat-btn" onclick="startNewChat()">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                        New Chat
                    </button>
                    <div class="history-list" id="historyList">
                        <!-- History Items go here -->
                    </div>
                </div>

                <!-- CHAT AREA -->
                <div class="chat-section">
                    <!-- Welcome View (WITH THE CHIPS INSIDE IT) -->
                    <div id="welcome-view">
                        <h1 class="welcome-text">Hi, <span id="welcomeName">User</span></h1>
                        <div id="dynamicGreeting"
                            style="font-size: 1.2rem; color: #a8c7fa; margin-top: 15px; font-weight: 500; text-align: center; max-width: 600px; line-height: 1.5;">
                        </div>
                        <h2 class="sub-welcome" style="margin-top: 30px;">What should we discuss today?</h2>

                        <!-- THE ONLY PLACE CHIPS SHOULD EXIST -->
                        <div class="suggestions-area" id="initialSuggestions"
                            style="position: relative; bottom: auto; margin-top: 20px;">
                        </div>
                    </div>

                    <!-- Chat History -->
                    <div class="messages-container" id="messages"></div>

                    <!-- Input -->
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Ask a question..." rows="1" oninput="autoResize(this)"
                            onkeypress="handleKeyPress(event)"></textarea>
                        <button class="send-icon-btn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- RESOURCES -->
                <div class="resources-section" id="resourcesPanel">
                    <div class="res-header">
                        <span>SOURCES & CONTEXT</span>
                    </div>
                    <div class="sources-list" id="sourcesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "";
        let currentUser = null;
        let currentSessionId = null;
        let activeChallenge = null;

        // --- 1. GLOBAL FUNCTIONS (So buttons can find them) ---
        window.startTopic = function (text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        };

        function addFeedbackButtons(container, originalQuery) {
            const bar = document.createElement('div');
            bar.className = 'feedback-bar';

            const actions = [
                { id: 'up', icon: '👍', label: '' },
                { id: 'down', icon: '👎', label: '' },
                { id: 'simplify', icon: '👶', label: 'Simplify' },
                { id: 'deep_dive', icon: '🤿', label: 'Deep Dive' }
            ];

            // Helper function to execute the API call
            async function sendFeedbackPayload(type, text = null) {
                const res = await fetch(`${API_URL}/api/v1/chat/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        session_id: currentSessionId,
                        message_index: 0,
                        feedback_type: type,
                        original_query: originalQuery,
                        feedback_text: text // Include the text!
                    })
                });
                const data = await res.json();
                if (data.action === 'regenerate') {
                    window.sendMessage(data.modified_query, true);
                }
            }

            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = 'feedback-btn';
                btn.innerHTML = `${act.icon} ${act.label}`;

                btn.onclick = async () => {
                    // Highlight the button
                    container.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // If it's a THUMBS DOWN, show the text box
                    if (act.id === 'down') {
                        // Prevent duplicate boxes if clicked multiple times
                        if (container.querySelector('.feedback-text-box')) return;

                        const box = document.createElement('div');
                        box.className = 'feedback-text-box';
                        box.style.marginTop = '15px';
                        box.style.padding = '10px';
                        box.style.background = 'rgba(0,0,0,0.2)';
                        box.style.borderRadius = '8px';
                        box.style.border = '1px solid #444';

                        box.innerHTML = `
                        <div style="font-size:0.85rem; color:#ccc; margin-bottom:5px;">What went wrong?</div>
                        <textarea placeholder="e.g., Too complicated, incorrect code, confusing diagram..." rows="2" 
                                  style="width:100%; box-sizing:border-box; padding:8px; border-radius:4px; border:1px solid #555; background:#1e1f20; color:#e3e3e3; font-family:inherit; outline:none; resize:vertical;"></textarea>
                        <div style="display:flex; justify-content:flex-end; margin-top:8px;">
                            <button style="padding:6px 12px; background:var(--accent-color); color:#000; border:none; border-radius:4px; font-weight:600; cursor:pointer; font-size:0.85rem;">Submit Feedback</button>
                        </div>
                    `;
                        container.appendChild(box);

                        // Handle Submit Click
                        const submitBtn = box.querySelector('button');
                        const textarea = box.querySelector('textarea');

                        submitBtn.onclick = async () => {
                            submitBtn.innerText = "Saving...";
                            await sendFeedbackPayload(act.id, textarea.value);
                            box.innerHTML = '<span style="color:#a8c7fa; font-size:0.85rem;">✅ Thank you! Your feedback helps me learn.</span>';
                            setTimeout(() => box.remove(), 3000); // Hide after 3 seconds
                        };

                    } else {
                        // For Thumbs Up, Simplify, Deep Dive -> Send immediately
                        await sendFeedbackPayload(act.id, null);
                    }
                };

                bar.appendChild(btn);
            });

            container.appendChild(bar);
        }

        function addProfilerButton(container, relativeUrl) {
            const btn = document.createElement('a');
            const cleanPath = relativeUrl.startsWith('/') ? relativeUrl.slice(1) : relativeUrl;
            btn.href = `${API_URL}/${cleanPath}`;
            btn.target = "_blank";
            btn.className = 'feedback-btn'; // Reuse feedback style
            btn.style.color = '#e67e22';
            btn.style.borderColor = '#e67e22';
            btn.innerHTML = '⚡ Profile';

            // Append to feedback bar if exists, else container
            const bar = container.querySelector('.feedback-bar');
            if (bar) bar.appendChild(btn);
            else container.appendChild(btn);
        }

        window.sendMessage = async function (overrideText = null, hidden = false) {
            const input = document.getElementById('userInput');
            const rawText = overrideText || input.value.trim();

            console.log("Sending:", rawText);

            if (!rawText) return;

            // Hide Welcome Screen
            const welcome = document.getElementById('welcome-view');
            if (welcome) welcome.style.display = 'none';
            const initialSug = document.getElementById('initialSuggestions');
            if (initialSug) initialSug.style.display = 'none';

            // --- NEW LOGIC: Only show bubble if NOT hidden ---
            if (!hidden) {
                const userDiv = document.createElement('div');
                userDiv.className = 'message user';
                let displayText = rawText.replace(/\n/g, '<br>');
                if (rawText.includes('{') || rawText.includes(';')) {
                    displayText = `<pre><code class="language-c">${rawText.replace(/</g, '&lt;')}</code></pre>`;
                }
                userDiv.innerHTML = `<div class="msg-sender">You</div>` + displayText;
                document.getElementById('messages').appendChild(userDiv);
                Prism.highlightAllUnder(userDiv);
            }
            // ------------------------------------------------

            // Clear Input
            input.value = '';
            input.style.height = 'auto';
            scrollToBottom();

            // 2. Add Bot Placeholder (Skeleton Loader)
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            const progId = `prog-${Date.now()}`;
            botDiv.innerHTML = `
            <div class="msg-sender bot">Tutor</div>
            <div id="text-${progId}"></div> 
            <div class="loading-container" id="${progId}">
                <div class="loading-status">
                    <div class="spinner"></div>
                    <span id="status-text-${progId}">Thinking...</span>
                </div>
                <div class="skeleton-line w-100"></div>
                <div class="skeleton-line w-80"></div>
                <div class="skeleton-line w-60"></div>
            </div>`;
            document.getElementById('messages').appendChild(botDiv);

            // 3. Prepare Payload
            let textToSend = rawText;
            if (activeChallenge) {
                textToSend = `[CONTEXT: Challenge "${activeChallenge}"]\n\n${rawText}`;
                activeChallenge = null;
            }

            try {
                const payload = {
                    message: textToSend,
                    user_role: currentUser.role,
                    username: currentUser.username,
                    session_id: currentSessionId
                };

                const response = await fetch(`${API_URL}/api/v1/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let currentMarkdown = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const lines = decoder.decode(value, { stream: true }).split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                // 1. STATUS UPDATE
                                if (data.type === 'status') {
                                    const statusText = document.getElementById(`status-text-${progId}`);
                                    if (statusText) statusText.innerText = data.message;
                                }
                                // 2. TOKEN STREAM
                                else if (data.type === 'token' || data.type === 'answer') {
                                    // Hide the ghost lines, but KEEP the spinner alive
                                    const skeletonLines = document.querySelectorAll(`#${progId} .skeleton-line`);
                                    skeletonLines.forEach(line => line.style.display = 'none');

                                    currentMarkdown += data.text;

                                    // Render markdown into the dedicated text container
                                    const textContainer = document.getElementById(`text-${progId}`);
                                    if (textContainer) {
                                        textContainer.innerHTML = marked.parse(currentMarkdown);
                                    }
                                    scrollToBottom();
                                }
                                // 3. COMPLETE
                                else if (data.type === 'complete') {
                                    if (data.data.session_id) currentSessionId = data.data.session_id;

                                    // Overwrite the entire bubble (which automatically destroys the spinner)
                                    botDiv.innerHTML = `<div class="msg-sender bot">Tutor</div>` + marked.parse(data.data.answer);
                                    displaySources(data.data.sources);
                                    renderDiagrams(botDiv);
                                    Prism.highlightAllUnder(botDiv);

                                    displaySuggestions(data.data.suggestions, botDiv);
                                    addFeedbackButtons(botDiv, rawText);
                                    loadChatHistory();
                                }
                                // 4. PROFILER
                                else if (data.type === 'profiler_report') {
                                    addProfilerButton(botDiv, data.url);
                                }
                            } catch (e) { console.warn(e); }
                        }
                    }
                }
            } catch (e) {
                console.error(e);
                botDiv.innerHTML = "<span style='color:#ff897d'>Connection failed.</span>";
            }
        };

        // --- 2. SUGGESTION RENDERER (Crucial) ---
        function displaySuggestions(suggestions, container) {
            if (!suggestions || suggestions.length === 0) return;

            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'bot-suggestions';

            suggestions.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';

                if (text.toLowerCase().startsWith('challenge')) {
                    btn.classList.add('challenge');
                    btn.innerText = "💪 " + text.replace('Challenge:', '').trim();
                    btn.onclick = function () {
                        activeChallenge = text.replace('Challenge:', '').trim();
                        window.sendMessage(`I accept the challenge: ${activeChallenge}`);
                    };
                } else {
                    btn.innerText = text;
                    // Explicitly bind the click
                    btn.addEventListener('click', function () {
                        window.sendMessage(text);
                    });
                }
                suggestionsDiv.appendChild(btn);
            });

            container.appendChild(suggestionsDiv);
        }

        // --- 3. OTHER UI FUNCTIONS ---
        function displaySources(sources) {
            const list = document.getElementById('sourcesList');
            list.innerHTML = '';
            if (!sources || sources.length === 0) return;

            const unique = new Map();
            sources.forEach(s => unique.set(s.document_name, s));
            unique.forEach(s => {
                const div = document.createElement('div');
                div.className = 'source-card';
                div.innerHTML = `<div class="source-title">📄 ${s.document_name}</div><div class="source-content">${marked.parse(s.chunk_text || "")}</div>`;
                list.appendChild(div);
            });
            Prism.highlightAllUnder(list);
        }

        async function renderDiagrams(container) {
            const blocks = container.querySelectorAll('code');
            for (const block of blocks) {
                // Check if it's explicitly mermaid class OR starts with graph/flowchart
                const txt = block.textContent.trim();
                const isMermaid = block.classList.contains('language-mermaid') ||
                    txt.startsWith('graph ') ||
                    txt.startsWith('flowchart ');

                if (isMermaid) {
                    try {
                        const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                        const { svg } = await window.mermaid.render(id, txt);
                        const div = document.createElement('div');
                        div.innerHTML = svg;
                        div.style.textAlign = 'center';

                        // Replace the <pre> parent if it exists, otherwise just the <code>
                        if (block.parentElement.tagName === 'PRE') {
                            block.parentElement.replaceWith(div);
                        } else {
                            block.replaceWith(div);
                        }
                    } catch (e) {
                        console.error("Mermaid Render Error:", e);
                    }
                }
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        function toggleAuth(view) {
            document.getElementById('loginForm').classList.toggle('hidden', view === 'signup');
            document.getElementById('signupForm').classList.toggle('hidden', view !== 'signup');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendMessage();
            }
        }

        function scrollToBottom() {
            const c = document.getElementById('messages');
            c.scrollTop = c.scrollHeight;
        }

        // --- 4. AUTH & LOAD ---
        async function performLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            try {
                const res = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const result = await res.json();
                if (res.ok) {
                    currentUser = result.user;
                    localStorage.setItem('c_tutor_user', JSON.stringify(currentUser));
                    routeUser();
                } else {
                    document.getElementById('loginError').innerText = result.detail;
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (e) { console.error(e); }
        }

        async function performSignup() {
            // Safe selection: use ?.value to prevent crash if element is missing
            const data = {
                name: document.getElementById('signName')?.value || "",
                email: document.getElementById('signEmail')?.value || "",
                username: document.getElementById('signUser')?.value || "",
                password: document.getElementById('signPass')?.value || "",
                // Optional fields with safety check
                university: document.getElementById('signUni')?.value || "",
                department: document.getElementById('signDept')?.value || "",
                interest: document.getElementById('signInterest')?.value || ""
            };

            // Validation
            if (!data.username || !data.password || !data.name) {
                showError('signupError', "Name, Username, and Password are required.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/v1/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('signupSuccess').innerText = "Account created! Please login.";
                    document.getElementById('signupSuccess').style.display = 'block';
                    setTimeout(() => toggleAuth('login'), 1500);
                } else {
                    const result = await res.json();
                    showError('signupError', result.detail || "Signup failed");
                }
            } catch (e) {
                console.error(e);
                showError('signupError', "Connection failed");
            }
        }

        function routeUser() {
            if (currentUser.role === 'teacher') window.location.href = 'teacher_dashboard.html';
            else initializeApp();
        }

        function initializeApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('welcomeName').innerText = currentUser.name || currentUser.username;
            document.getElementById('roleBadge').innerText = currentUser.role.toUpperCase();

            loadChatHistory();

            // --- NEW: Automatically greet the user on login ---
            startNewChat();
        }

        function logout() { localStorage.removeItem('c_tutor_user'); location.reload(); }
        function openDashboard() { window.location.href = currentUser.role === 'teacher' ? 'teacher_dashboard.html' : 'student_dashboard.html'; }

        // --- 5. HISTORY & SIDEBAR ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 900) {
                // Mobile: slide in/out
                sidebar.classList.toggle('open');
                overlay.classList.toggle('open');
            } else {
                // Desktop: collapse width
                sidebar.classList.toggle('collapsed');
            }
        }

        function toggleResources() {
            if (window.innerWidth <= 900) {
                document.body.classList.toggle('show-resources-mobile');
            } else {
                document.body.classList.toggle('hide-resources');
            }
        }


        async function loadChatHistory() {
            if (!currentUser) return;
            try {
                const res = await fetch(`${API_URL}/api/v1/history/sessions?username=${currentUser.username}`);
                const sessions = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';

                sessions.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    if (s.id === currentSessionId) item.classList.add('active');

                    // Chat Title Text
                    const span = document.createElement('span');
                    span.innerText = s.title || "Untitled Chat";
                    span.onclick = () => loadSession(s.id);

                    // Delete Button (Trash Icon)
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-chat-btn';
                    delBtn.innerHTML = '🗑️'; // Or use SVG
                    delBtn.onclick = (e) => {
                        e.stopPropagation(); // Prevent clicking the chat itself
                        deleteSession(s.id);
                    };

                    item.appendChild(span);
                    item.appendChild(delBtn);
                    list.appendChild(item);
                });
            } catch (e) { console.error("History load error", e); }
        }

        async function deleteSession(sessionId) {
            if (!confirm("Are you sure you want to remove this chat?")) return;

            try {
                const res = await fetch(`${API_URL}/api/v1/history/session/${sessionId}?username=${currentUser.username}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    // If we deleted the active chat, reset to New Chat
                    if (sessionId === currentSessionId) startNewChat();
                    loadChatHistory(); // Refresh list
                }
            } catch (e) { console.error(e); }
        }

        async function loadSession(sessionId) {
            currentSessionId = sessionId;
            document.getElementById('welcome-view').style.display = 'none';
            document.getElementById('initialSuggestions').style.display = 'none';

            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px;">Loading...</div>';

            try {
                const res = await fetch(`${API_URL}/api/v1/history/session/${sessionId}?username=${currentUser.username}`);
                const sessionData = await res.json();

                msgDiv.innerHTML = '';

                sessionData.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role}`;
                    if (msg.role === 'user') {
                        let text = msg.content.replace(/\n/g, '<br>');
                        if (text.includes('{') || text.includes(';')) text = `<pre><code class="language-c">${text.replace(/</g, '&lt;')}</code></pre>`;
                        div.innerHTML = `<div class="msg-sender">You</div>` + text;
                    } else {
                        div.innerHTML = `<div class="msg-sender bot">Tutor</div>` + marked.parse(msg.content);
                        renderDiagrams(div);
                    }
                    msgDiv.appendChild(div);
                });
                Prism.highlightAllUnder(msgDiv);
                scrollToBottom();
                loadChatHistory();
            } catch (e) { console.error("Session load error", e); }
        }

        async function startNewChat() {
            currentSessionId = null;
            document.getElementById('messages').innerHTML = '';
            document.getElementById('sourcesList').innerHTML = '';

            // Show the centered welcome view
            document.getElementById('welcome-view').style.display = 'flex';
            document.getElementById('initialSuggestions').style.display = 'flex';

            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));

            // Fetch the dynamic greeting silently
            try {
                const res = await fetch(`${API_URL}/api/v1/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Use the special [INIT_SESSION] trigger
                    body: JSON.stringify({
                        message: '[INIT_SESSION]',
                        user_role: currentUser.role,
                        username: currentUser.username,
                        session_id: null
                    })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const lines = decoder.decode(value, { stream: true }).split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'complete') {
                                    // Capture the session_id so subsequent messages continue THIS session
                                    if (data.data && data.data.session_id) {
                                        currentSessionId = data.data.session_id;
                                    }

                                    // 1. Inject the greeting text
                                    let cleanGreeting = data.data.answer.replace("👋 **Welcome back!**\n\n", "").replace(/\n/g, '<br>');
                                    document.getElementById('dynamicGreeting').innerHTML = cleanGreeting;

                                    // 2. Inject the dynamic suggestion chips
                                    const suggestionsDiv = document.getElementById('initialSuggestions');
                                    suggestionsDiv.innerHTML = ''; // clear old ones

                                    data.data.suggestions.forEach(text => {
                                        const chip = document.createElement('div');
                                        chip.className = 'suggestion-chip';
                                        chip.innerText = text;

                                        // Make sure CSS pointers are enabled
                                        chip.style.pointerEvents = 'auto';

                                        // Add the click listener
                                        chip.addEventListener('click', function () {
                                            window.startTopic(text);
                                        });

                                        suggestionsDiv.appendChild(chip);
                                    });
                                }
                            } catch (e) { }
                        }
                    }
                }
            } catch (e) {
                console.error("Failed to load greeting", e);
            }
        }

        // Init
        const stored = localStorage.getItem('c_tutor_user');
        if (stored) { currentUser = JSON.parse(stored); routeUser(); }
    </script>
</body>

</html>
