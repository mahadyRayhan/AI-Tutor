<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    
    <!-- Mermaid.js Module (Keep this in HTML because it's an external module import) -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        window.mermaid = mermaid;
    </script>

    <!-- LINK TO YOUR NEW CSS FILE -->
    <link rel="stylesheet" href="/static/css/chat.css">
</head>

<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <!-- Login Form -->
        <div class="auth-card" id="loginForm">
            <h2>👋 Welcome Back</h2>
            <input type="text" id="loginUser" class="auth-input" placeholder="Username">
            <input type="password" id="loginPass" class="auth-input" placeholder="Password">
            <button class="auth-btn" onclick="performLogin()">Log In</button>
            <div class="toggle-link" onclick="toggleAuth('signup')">Create an account</div>
            <div class="error-msg" id="loginError"></div>
        </div>
        <!-- Signup Form (Same as before) -->
        <div class="auth-card hidden" id="signupForm">
            <h2>🚀 Create Account</h2>
            <input type="text" id="signName" class="auth-input" placeholder="Full Name">
            <input type="email" id="signEmail" class="auth-input" placeholder="Email">
            <input type="text" id="signUser" class="auth-input" placeholder="Username">
            <input type="password" id="signPass" class="auth-input" placeholder="Password">

            <!-- Optional Fields (Ensure IDs match JS) -->
            <input type="text" id="signUni" class="auth-input" placeholder="University (Optional)">
            <input type="text" id="signDept" class="auth-input" placeholder="Department (Optional)">
            <input type="text" id="signInterest" class="auth-input" placeholder="Topic of Interest (Optional)">

            <button class="auth-btn" onclick="performSignup()">Sign Up</button>
            <div class="toggle-link" onclick="toggleAuth('login')">Back to Login</div>
            <div class="error-msg" id="signupError"></div>
            <div class="success-msg" id="signupSuccess"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen">
        <div class="main-container">

            <!-- TOP BAR (spans full width above everything) -->
            <div class="top-bar">
                <div style="display:flex; align-items:center">
                    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    <span id="roleBadge" class="role-badge">STUDENT</span>
                </div>
                <div>
                    <button class="top-toggle" onclick="toggleResources()" title="Toggle sources">📚</button>
                    <button class="nav-btn" onclick="openPreferencesModal()">⚙️ Custom Instructions</button>
                    <button class="nav-btn" onclick="openDashboard()">Dashboard</button>
                    <button class="nav-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- CONTENT ROW: sidebar + chat + resources -->
            <div class="content-row">
                <!-- SIDEBAR -->
                <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
                <div class="sidebar" id="sidebar">
                    <button class="new-chat-btn" onclick="startNewChat()">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                        New Chat
                    </button>
                    <div class="history-list" id="historyList">
                        <!-- History Items go here -->
                    </div>
                </div>

                <!-- CHAT AREA -->
                <div class="chat-section">
                    <!-- Welcome View (WITH THE CHIPS INSIDE IT) -->
                    <div id="welcome-view">
                        <h1 class="welcome-text">Hi, <span id="welcomeName">User</span></h1>
                        <div id="dynamicGreeting"
                            style="font-size: 1.2rem; color: #a8c7fa; margin-top: 15px; font-weight: 500; text-align: center; max-width: 600px; line-height: 1.5;">
                        </div>
                        <h2 class="sub-welcome" style="margin-top: 30px;">What should we discuss today?</h2>

                        <!-- THE ONLY PLACE CHIPS SHOULD EXIST -->
                        <div class="suggestions-area" id="initialSuggestions"
                            style="position: relative; bottom: auto; margin-top: 20px;">
                        </div>
                    </div>

                    <!-- Chat History -->
                    <div class="messages-container" id="messages"></div>

                    <!-- Input -->
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Ask a question..." rows="1" oninput="autoResize(this)"
                            onkeypress="handleKeyPress(event)"></textarea>
                        <button class="send-icon-btn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- RESOURCES -->
                <div class="resources-section" id="resourcesPanel">
                    <div class="res-header">
                        <span>SOURCES & CONTEXT</span>
                    </div>
                    <div class="sources-list" id="sourcesList"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- PREFERENCES & ACCESSIBILITY MODAL -->
    <div id="preferencesModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:3000; justify-content:center; align-items:center;">
        <div style="background: var(--sidebar-bg); padding: 30px; border-radius: 16px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0; font-size:1.4rem;">⚙️ Settings & Accessibility</h2>
                <button onclick="closePreferencesModal()" style="background:none; border:none; color:#aaa; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            
            <!-- Custom Instructions -->
            <h3 style="font-size:1rem; margin-bottom:10px; color:var(--accent-color);">💬 Custom Instructions</h3>
            <textarea id="customInstText" rows="2" placeholder="e.g. 'I already know Python, compare things to Python.'" style="width:100%; padding:10px; border-radius:8px; background:var(--input-bg); color:var(--text-primary); border:1px solid var(--border-color); margin-bottom:20px;"></textarea>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Column 1: Learning Style -->
                <div>
                    <h3 style="font-size:1rem; margin-bottom:10px; color:var(--accent-color);">🧠 Learning Style</h3>
                    <div style="display:flex; flex-direction:column; gap:10px; font-size:0.9rem;">
                        <label title="Strips analogies/metaphors. Gives direct, literal computer science definitions."><input type="checkbox" id="chkLiteral"> Literal / Technical Mode</label>
                        <label title="Forces the AI to give the shortest possible answer."><input type="checkbox" id="chkConcise"> Concise (TL;DR) Mode</label>
                        <hr style="border:0; border-top:1px solid var(--border-color); margin: 5px 0;">
                        <label><input type="checkbox" id="chkExplanation"> Include Theory/Explanation</label>
                        <label><input type="checkbox" id="chkUseCases"> Include Real-world Uses</label>
                        <label><input type="checkbox" id="chkVisual"> Include Visual Diagrams</label>
                        <label><input type="checkbox" id="chkExample"> Include Code Examples</label>
                    </div>
                </div>

                <!-- Column 2: Neurodiversity & Pacing -->
                <div>
                    <h3 style="font-size:1rem; margin-bottom:10px; color:var(--accent-color);">👁️ Accessibility & Pacing</h3>
                    <div style="display:flex; flex-direction:column; gap:10px; font-size:0.9rem;">
                        <label title="Changes font to a Dyslexia-friendly typeface."><input type="checkbox" id="chkDyslexia"> Dyslexia-Friendly Font</label>
                        <label title="Increases line height to reduce visual crowding."><input type="checkbox" id="chkSpacing"> Extra Line Spacing</label>
                        <label title="Makes code blocks high-contrast."><input type="checkbox" id="chkContrast"> High Contrast Code</label>
                        <hr style="border:0; border-top:1px solid var(--border-color); margin: 5px 0;">
                        <label title="Gentle reminder to hydrate/stretch after 45 mins."><input type="checkbox" id="chkBreaks"> 45-Min Break Reminders</label>
                    </div>
                </div>
            </div>

            <button id="savePrefsBtn" onclick="savePreferences()" style="width:100%; padding:12px; background:var(--accent-color); color:#000; border:none; border-radius:8px; font-weight:600; cursor:pointer; margin-top:25px; font-size:1rem;">
                Save Preferences
            </button>
        </div>
    </div>
    <script src="/static/js/chat.js" defer></script>
</body>

</html>
