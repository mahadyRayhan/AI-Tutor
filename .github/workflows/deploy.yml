name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - rayhan-tutor # Change this to 'main' when you merge to production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Securely generate the .env file from your GitHub Secrets and Variables
      - name: Create .env file
        run: |
          touch .env
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "NEO4J_CONNECTION_URL=${{ secrets.NEO4J_CONNECTION_URL }}" >> .env
          echo "NEO4J_USER=${{ secrets.NEO4J_USER }}" >> .env
          echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}" >> .env
          echo "VEO3_MODEL=${{ vars.VEO3_MODEL }}" >> .env
          echo "INTENT_CLASSIFIER_MODE=${{ vars.INTENT_CLASSIFIER_MODE }}" >> .env
          echo "ENABLE_PROFILING=${{ vars.ENABLE_PROFILING }}" >> .env

      # Compress files, excluding things we don't want to overwrite on the server
      - name: Create deployment archive
        run: |
          zip -r deployment.zip . -x "**/__pycache__/*" "**/venv/*" ".git/*" "database/chroma_db/*"

      # Transfer the zip and the new .env file to your AWS server
      - name: Copy files to AWS Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment.zip,.env"
          target: "/home/ubuntu"

      # SSH into the server and execute the deployment commands
      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            # Step A: Stop current services and CREATE BACKUP (using cp, not mv)
            if [ -d "/home/ubuntu/AI-Tutor" ]; then
              cd /home/ubuntu/AI-Tutor
              sudo docker-compose down || true
              cd /home/ubuntu
              # Copy the folder to keep a safe backup of both tracked and untracked files
              cp -r AI-Tutor AI-Tutor_backup_$(date +%F_%H-%M)
            else
              # If it's the very first deployment, create the folder
              mkdir -p /home/ubuntu/AI-Tutor
            fi

            # Step B: Unzip new code OVER the existing folder
            unzip -o /home/ubuntu/deployment.zip -d /home/ubuntu/AI-Tutor
            
            # Move the dynamically generated .env into the project folder
            mv /home/ubuntu/.env /home/ubuntu/AI-Tutor/.env

            # Step C: Set permissions exactly as outlined in your manual guide
            cd /home/ubuntu/AI-Tutor
            mkdir -p backend/database logs resources
            sudo chmod -R 777 backend/database/ logs/ resources/ || true

            # Step D: Build and launch
            sudo docker-compose up --build -d
            
            # Clean up the zip file to save disk space
            rm /home/ubuntu/deployment.zip
