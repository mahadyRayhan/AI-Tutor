services:
  backend:
    build:
      context: ./backend
    # Auto-restart on crash or host reboot — but NOT if you manually `docker-compose stop`.
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://graph-db:7687
      - NEO4J_PASSWORD=12345678
      - GOOGLE_API_KEY
      - OPENAI_API_KEY
      # Account recovery mail. These MUST be listed here: inside the container
      # config.py resolves PROJECT_ROOT to "/" and looks for /.env, which does not
      # exist — the deployed .env sits on the host next to docker-compose.yml and is
      # never mounted in. Compose reads that .env for interpolation, so this list is
      # the only path these values have into the app. Without them email_service
      # falls back to RELAY mode and writes reset links to the log instead of sending.
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - SAGE_BASE_URL
      # Session signing. With SAGE_JWT_SECRET unset, auth.py mints a RANDOM key per
      # process, so every container restart invalidates every cookie and signs all
      # students out mid-lecture — which is why the checkpoint 401 shows up right
      # after a deploy. Setting it makes sessions survive restarts.
      - SAGE_JWT_SECRET
      - SAGE_SESSION_HOURS
      - SAGE_COOKIE_SECURE
      - PYTHONPATH=/app
      # CAC switches. Compose only forwards variables named here, so without
      # these lines `export SAGE_CAC_ENFORCE_ENABLED=true` on the host never
      # reaches the app and the layer stays silently in shadow mode. Unset on the
      # host they resolve to their code defaults (enforce OFF, region gate ON),
      # so listing them changes nothing until one is deliberately set.
      - SAGE_CAC_ENFORCE_ENABLED
      - SAGE_CAC_REGION_GATE_ENABLED
      - SAGE_CAC_RUNG_ENABLED
      - SAGE_CAC_HORIZON_ENABLED
      - SAGE_CAC_EDGE_ENABLED
      - SAGE_CAC_RECALIBRATE_EVERY
      - SAGE_ABLATE
    volumes:
      # Maps host folder to the root (for absolute path code)
      # - ./database:/database
      - ./resources:/resources
      # Maps host folder to /app (for relative path code)
      # - ./database:/app/database
      - ./backend/database:/backend/database
      - ./resources:/app/resources
      - ./scripts:/app/scripts
      # Add logs to prevent permission crashes during logging
      - ./logs:/app/logs
    depends_on:
      graph-db:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /backend/database/video &&
             python /app/scripts/ingest_data.py && 
             python /app/scripts/ingest_manual_graph.py && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  graph-db:
    image: neo4j:latest
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/12345678
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: