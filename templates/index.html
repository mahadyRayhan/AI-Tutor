    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        window.mermaid = mermaid;

    <style>
        /* ... (Keep your existing CSS for chat) ... */
        :root { --bg-color: #f4f4f9; --chat-bg: #ffffff; --primary-color: #2c3e50; --accent-color: #3498db; --user-msg-bg: #3498db; --bot-msg-bg: #ecf0f1; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; height: 100vh; color: #333; }
        
        /* LOGIN SCREEN STYLES */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; text-align: center;
        }
        .login-card h2 { margin-top: 0; color: #2c3e50; }
        .login-input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd;
            border-radius: 6px; box-sizing: border-box;
        }
        .login-btn {
            width: 100%; padding: 12px; background: #3498db; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .login-btn:hover { background: #2980b9; }
        .error-msg { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; }

        /* APP SCREEN (Hidden by default) */
        #app-screen { display: none; width: 100%; height: 100%; }

        /* ... Reuse your existing Chat CSS ... */
        .main-container { display: flex; width: 100%; max-width: 1400px; margin: 0 auto; gap: 20px; padding: 20px; height: 100%; box-sizing: border-box; }
        .chat-section { flex: 2; display: flex; flex-direction: column; background: var(--chat-bg); border-radius: 12px; overflow: hidden; }
        .resources-section { flex: 1; background: var(--chat-bg); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: var(--primary-color); color: white; padding: 15px 20px; font-size: 1.2rem; font-weight: 600; display: flex; justify-content: space-between; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .message.user { align-self: flex-end; background-color: var(--user-msg-bg); color: white; border-bottom-right-radius: 2px; }
        .message.user pre { background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px; overflow-x: auto; }
        .message.bot { align-self: flex-start; background-color: var(--bot-msg-bg); color: #2c3e50; border-bottom-left-radius: 2px; }
        .message.bot h2 { font-size: 1.1rem; margin: 10px 0 5px; color: #2c3e50; }
        .message.bot ul { margin: 5px 0; padding-left: 20px; }
        .message.bot p { margin: 5px 0; }
        
        /* Inline Code (e.g. `int`) */
        .message.bot :not(pre) > code { 
            background: rgba(0,0,0,0.1); 
            padding: 2px 4px; 
            border-radius: 4px; 
            font-family: monospace; 
            color: #c7254e; /* Reddish text for visibility */
        }

        /* Block Code (Prism) */
        pre[class*="language-"] {
            background: #2d2d2d !important; /* Force Dark Background */
            color: #f8f8f2 !important;      /* Force Light Text */
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        
        code[class*="language-"] {
            text-shadow: none !important;
        }
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #f9f9f9; align-items: flex-end; }
        textarea { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; outline: none; font-family: 'Consolas', monospace; min-height: 45px; max-height: 150px; resize: none; }
        button#sendBtn { padding: 0 24px; height: 48px; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .suggestions-container { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .suggestion-btn { background: white; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        .suggestion-btn.challenge { border-color: #e67e22; color: #e67e22; font-weight: bold; }
        .resources-header { padding: 15px; border-bottom: 1px solid #eee; font-weight: 600; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center; }
        .sources-list { height: 100%; overflow-y: auto; padding: 15px; }
        .source-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 15px; }
        .source-title { padding: 8px 12px; background: #e9ecef; font-size: 0.85rem; font-weight: 600; border-bottom: 1px solid #dee2e6; }
        .source-content { padding: 10px; font-size: 0.8rem; max-height: 200px; overflow-y: auto; background: #fff; }
        
        /* Logout Button */
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .progress-step-container {

            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-step-fill {
            height: 100%;
            background: #3498db;
            width: 5%;
            transition: width 0.5s ease-in-out;
            border-radius: 2px;
        }
    </style>
</head>

<div id="login-screen">
    <div class="login-card">
        <h2>🎓 C Tutor Login</h2>
        <input type="text" id="username" class="login-input" placeholder="Username (e.g., student1)">

                </div>

                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>

            showApp();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }
    }

    async function performLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const err = document.getElementById('loginError');

        try {
            const res = await fetch(`${API_URL}/api/v1/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });

            if (res.ok) {
                const data = await res.json();
                currentUser = data.user;
                localStorage.setItem('c_tutor_user', JSON.stringify(currentUser));
                
                // --- NEW ROUTING LOGIC ---
                if (currentUser.role === 'teacher') {
                    window.location.href = 'teacher_dashboard.html'; // Teachers go to Dashboard
                } else {
                    showApp(); // Students stay on Chat
                }
                // -------------------------
            } else {
                err.style.display = 'block';
            }
        } catch (e) {
            console.error(e);
            err.innerText = "Server Error";
            err.style.display = 'block';
        }
    }

    async function sendMessage(overrideText = null) {
        const rawText = overrideText || input.value.trim();
        if (!rawText) return;

        // UI: User Message
        let displayHtml = rawText.replace(/\n/g, '<br>');
        if (rawText.includes('{') || rawText.includes(';') || rawText.includes('#include')) {
             displayHtml = `<pre>${rawText}</pre>`;
        }
        
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.innerHTML = displayHtml;
        messagesDiv.appendChild(userDiv);
        scrollToBottom();

        input.value = '';
        input.style.height = 'auto';
        input.disabled = true;
        sendBtn.disabled = true;

        // Context Logic
        let textToSend = rawText;
        if (activeChallenge) {
            textToSend = `[CONTEXT: User is solving Challenge: "${activeChallenge}"]\n\nUser Code:\n${rawText}`;
            activeChallenge = null; 
        }

        // UI: Bot Placeholder
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'message bot';
        // --- NEW: INITIAL HTML IS A PROGRESS BAR ---
        botMsgDiv.innerHTML = `
            <div class="progress-step-container" id="bot-progress-${Date.now()}">
                <div class="progress-step-text">
                    <span id="prog-text">Initializing...</span>
                    <span id="prog-pct">0%</span>
                </div>
                <div class="progress-step-track">
                    <div class="progress-step-fill" style="width: 5%"></div>
                </div>
            </div>
        `;
        // -------------------------------------------
        messagesDiv.appendChild(botMsgDiv);
        scrollToBottom();

        try {
            const response = await fetch(`${API_URL}/api/v1/chat/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: textToSend, 
                    user_role: currentUser.role,
                    username: currentUser.username
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            
            // Buffer for the full markdown text
            let currentMarkdown = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.trim() === '') continue;
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.type === 'status') {
                                // Update Intent Badge (Existing)
                                if(intentBadge) intentBadge.innerText = data.message;
                                
                                // --- NEW: UPDATE PROGRESS BAR ---
                                const fill = botMsgDiv.querySelector('.progress-step-fill');
                                const text = botMsgDiv.querySelector('#prog-text');
                                const pct = botMsgDiv.querySelector('#prog-pct');
                                
                                if (fill && data.percent) {
                                    fill.style.width = data.percent + "%";
                                    text.innerText = data.message;
                                    pct.innerText = data.percent + "%";
                                }
                                // -------------------------------
                            }
                            else if (data.type === 'token') {
                                // --- STREAMING TEXT ---
                                currentMarkdown += data.text;
                                botMsgDiv.innerHTML = marked.parse(currentMarkdown);
                                scrollToBottom();
                            }
                            else if (data.type === 'answer') {
                                // Fallback for non-streaming blocks (like "Hold On")
                                currentMarkdown = data.text;
                                botMsgDiv.innerHTML = marked.parse(currentMarkdown);
                            }
                            else if (data.type === 'complete') {
                                // --- FINAL POLISH PHASE ---
                                // 1. Render Final Markdown (Clean)
                                botMsgDiv.innerHTML = marked.parse(data.data.answer);
                                
                                // 2. Display Metadata
                                displaySources(data.data.sources);
                                if (data.data.suggestions && data.data.suggestions.length > 0) {
                                    displaySuggestions(data.data.suggestions, botMsgDiv);
                                }

                                // 3. Render Diagrams (Robust Selector)
                                // Look for code blocks that contain 'graph TD' content
                                const codeBlocks = botMsgDiv.querySelectorAll('code');
                                for (const block of codeBlocks) {
                                    const text = block.textContent.trim();
                                    if (text.startsWith('graph TD') || text.startsWith('graph LR')) {
                                        try {
                                            const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                                            const { svg } = await window.mermaid.render(id, text);
                                            const div = document.createElement('div');
                                            div.innerHTML = svg;
                                            div.style.textAlign = 'center';
                                            div.style.margin = '15px 0';
                                            
                                            // Replace the parent <pre> tag
                                            const pre = block.parentElement;
                                            if (pre.tagName === 'PRE') {
                                                pre.replaceWith(div);
                                            } else {
                                                block.replaceWith(div);
                                            }
                                        } catch (e) {
                                            console.error("Mermaid Render Error", e);
                                        }
                                    }
                                }

                                // 4. Highlight Code (Prism) - Run AFTER Mermaid replacement
                                Prism.highlightAllUnder(botMsgDiv);
                                scrollToBottom();
                            }
                        } catch (e) {
                            console.warn("JSON Parse Error", e);
                        }
                    }
                }
            }

        } catch (error) {
            botMsgDiv.innerHTML = "Connection error.";
            console.error(error);
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function displaySuggestions(suggestions, containerDiv) {
        const suggDiv = document.createElement('div');
        suggDiv.className = 'suggestions-container';

        suggestions.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'suggestion-btn';
            
            if (text.toLowerCase().startsWith('challenge')) {
                btn.classList.add('challenge');
                btn.innerText = "💪 " + text.replace('Challenge:', '').trim();
                btn.onclick = () => { suggDiv.remove(); handleChallengeClick(text); };
            } else {
                btn.innerText = text;
                btn.onclick = () => { suggDiv.remove(); sendMessage(text); };
            }
            suggDiv.appendChild(btn);
        });
        containerDiv.appendChild(suggDiv);
        scrollToBottom();
    }

    function handleChallengeClick(challengeText) {
        activeChallenge = challengeText.replace("💪 ", "").replace("Challenge:", "").trim();
        const acceptDiv = document.createElement('div');
        acceptDiv.className = 'message user';
        acceptDiv.innerText = "I accept: " + activeChallenge;
        messagesDiv.appendChild(acceptDiv);

        const botDiv = document.createElement('div');
        botDiv.className = 'message bot';
        botDiv.innerText = "Paste your code solution below!";
        messagesDiv.appendChild(botDiv);
        scrollToBottom();

        input.value = "// Write your C code here:\n\n";
        input.focus();
    }

    function displaySources(sources) {
        sourcesDiv.innerHTML = ''; 
        if (!sources || sources.length === 0) {
            sourcesDiv.innerHTML = '<div style="color:#888; text-align:center; margin-top:20px;">No sources found.</div>';
            return;
        }

        const uniqueSources = new Map();
        sources.forEach(s => uniqueSources.set(s.document_name, s));

        uniqueSources.forEach((source) => {
            const card = document.createElement('div');
            card.className = 'source-card';
            const isCode = source.document_name.endsWith('.c');
            const isRestricted = source.access_level === 'teacher';
            const icon = isRestricted ? '🔒' : (isCode ? '💻' : '📖');
            
            let contentHtml = source.chunk_text || "";
            if (isCode) contentHtml = `<pre><code class="language-c">${contentHtml.replace(/</g, '&lt;')}</code></pre>`;
            else contentHtml = marked.parse(contentHtml);

            card.innerHTML = `
                <div class="source-title" style="${isRestricted ? 'background:#ffecb3;' : ''}">
                    <span>${icon} ${source.document_name}</span>
                </div>
                <div class="source-content">${contentHtml}</div>
            `;
            sourcesDiv.appendChild(card);
        });
        Prism.highlightAllUnder(sourcesDiv);
    }

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function openDashboard() {
        if (currentUser.role === 'teacher') {
            window.location.href = 'teacher_dashboard.html'; // Existing teacher dashboard
        } else {
            window.location.href = 'student_dashboard.html'; // New student dashboard
        }
    }

    // Start App
    checkAuth();
</script>
