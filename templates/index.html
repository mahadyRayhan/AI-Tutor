<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Programming Tutor</title>
    <!-- Keep existing libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
        window.mermaid = mermaid;
    </script>

    <style>
        /* Keep existing styles */
        :root { --bg-color: #f4f4f9; --chat-bg: #ffffff; --primary-color: #2c3e50; --accent-color: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; height: 100vh; color: #333; }
        
        /* UPDATED LOGIN/SIGNUP STYLES */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            overflow-y: auto; /* Allow scrolling if signup form is tall */
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 400px; text-align: center;
            margin: 20px;
        }
        .auth-card h2 { margin-top: 0; color: #2c3e50; }
        .auth-input {
            width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd;
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: #3498db; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
        }
        .auth-btn:hover { background: #2980b9; }
        .toggle-link { color: #3498db; cursor: pointer; margin-top: 15px; display: block; font-size: 0.9rem; text-decoration: underline; }
        .error-msg { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; }
        .success-msg { color: #27ae60; font-size: 0.9rem; margin-top: 10px; display: none; }

        /* Hidden Classes */
        .hidden { display: none; }
        
        /* ... Keep the rest of your chat CSS ... */
        #app-screen { display: none; width: 100%; height: 100%; }
        /* (Paste the rest of your Chat CSS here for .main-container, .chat-section, etc.) */
        /* For brevity, assuming existing CSS is preserved below */
        .main-container { display: flex; width: 100%; max-width: 1400px; margin: 0 auto; gap: 20px; padding: 20px; height: 100%; box-sizing: border-box; }
        .chat-section { flex: 2; display: flex; flex-direction: column; background: #fff; border-radius: 12px; overflow: hidden; }
        .resources-section { flex: 1; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: var(--primary-color); color: white; padding: 15px 20px; font-size: 1.2rem; font-weight: 600; display: flex; justify-content: space-between; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .message.user { align-self: flex-end; background-color: var(--accent-color); color: white; }
        .message.bot { align-self: flex-start; background-color: #ecf0f1; color: #2c3e50; }
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #f9f9f9; align-items: flex-end; }
        textarea { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; }
        button#sendBtn { padding: 0 24px; height: 48px; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; }
        .source-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 15px; padding: 10px; }
    </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
    <!-- Login Form -->
    <div class="auth-card" id="loginForm">
        <h2>🎓 C Tutor Login</h2>
        <input type="text" id="loginUser" class="auth-input" placeholder="Username">
        <input type="password" id="loginPass" class="auth-input" placeholder="Password">
        <button class="auth-btn" onclick="performLogin()">Login</button>
        <div class="toggle-link" onclick="toggleAuth('signup')">New here? Create an Account</div>
        <div class="error-msg" id="loginError"></div>
    </div>

    <!-- Signup Form -->
    <div class="auth-card hidden" id="signupForm">
        <h2>📝 Create Account</h2>
        <input type="text" id="signName" class="auth-input" placeholder="Full Name">
        <input type="email" id="signEmail" class="auth-input" placeholder="Email Address">
        <input type="text" id="signUser" class="auth-input" placeholder="Username (Unique)">
        <input type="password" id="signPass" class="auth-input" placeholder="Password">
        
        <!-- Optional Fields -->
        <input type="text" id="signUni" class="auth-input" placeholder="University (Optional)">
        <input type="text" id="signDept" class="auth-input" placeholder="Department (Optional)">
        <input type="text" id="signInterest" class="auth-input" placeholder="Topic of Interest (Optional)">

        <button class="auth-btn" onclick="performSignup()">Sign Up</button>
        <div class="toggle-link" onclick="toggleAuth('login')">Already have an account? Login</div>
        <div class="error-msg" id="signupError"></div>
        <div class="success-msg" id="signupSuccess"></div>
    </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">
    <div class="main-container">
        <!-- Chat Section -->
        <div class="chat-section">
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    🎓 C Programming Tutor
                    <span id="roleBadge" style="font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px;">STUDENT</span>
                </div>
                <div>
                    <button class="logout-btn" onclick="openDashboard()">📊 Dashboard</button>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="messages-container" id="messages">
                <div class="message bot">Hello! I'm your C Tutor. How can I help you learn today?</div>
            </div>
            <div class="input-area">
                <textarea id="userInput" placeholder="Type your code or question..."></textarea>
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
        <!-- Resources Section -->
        <div class="resources-section">
            <div style="padding:15px; border-bottom:1px solid #eee; font-weight:bold;">📚 References</div>
            <div id="sourcesList" style="padding:15px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";
    const messagesDiv = document.getElementById('messages');
    const sourcesDiv = document.getElementById('sourcesList');
    const intentBadge = document.getElementById('intentBadge');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    let activeChallenge = null;
    
    // CURRENT USER STATE
    let currentUser = null;

    // --- AUTH LOGIC ---
    function toggleAuth(view) {
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('signupError').style.display = 'none';
        document.getElementById('signupSuccess').style.display = 'none';
        
        if (view === 'signup') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
        } else {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
    }
    function checkAuth() {
        const storedUser = localStorage.getItem('c_tutor_user');
        if (storedUser) {
            currentUser = JSON.parse(storedUser);
            showApp();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }
    }

    async function performSignup() {
        const data = {
            name: document.getElementById('signName').value,
            email: document.getElementById('signEmail').value,
            username: document.getElementById('signUser').value,
            password: document.getElementById('signPass').value,
            university: document.getElementById('signUni').value,
            department: document.getElementById('signDept').value,
            interest: document.getElementById('signInterest').value
        };

        if(!data.username || !data.password || !data.name) {
            showError('signupError', "Name, Username and Password are required.");
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/v1/auth/signup`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            if (res.ok) {
                document.getElementById('signupSuccess').innerText = "Account created! Please login.";
                document.getElementById('signupSuccess').style.display = 'block';
                setTimeout(() => toggleAuth('login'), 2000);
            } else {
                showError('signupError', result.detail);
            }
        } catch (e) { showError('signupError', "Connection failed"); }
    }

    async function performLogin() {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        
        try {
            const res = await fetch(`${API_URL}/api/v1/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const result = await res.json();

            if (res.ok) {
                currentUser = result.user;
                localStorage.setItem('c_tutor_user', JSON.stringify(currentUser));
                routeUser();
            } else {
                showError('loginError', result.detail || "Invalid credentials");
            }
        } catch (e) { showError('loginError', "Connection failed"); }
    }

    function routeUser() {
        if(currentUser.role === 'teacher') window.location.href = 'teacher_dashboard.html';
        else showApp();
    }

    function showError(elemId, msg) {
        const el = document.getElementById(elemId);
        el.innerText = msg;
        el.style.display = 'block';
    }

    function showApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('roleBadge').innerText = currentUser.role.toUpperCase();
    }

    function logout() {
        localStorage.removeItem('c_tutor_user');
        location.reload();
    }

    function openDashboard() {
        if (currentUser.role === 'teacher') {
            window.location.href = 'teacher_dashboard.html'; // Existing teacher dashboard
        } else {
            window.location.href = 'student_dashboard.html'; // New student dashboard
        }
    }

    // --- CHAT LOGIC ---
    // Auto-resize textarea
    input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    function handleKeyPress(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage(overrideText = null) {
        const rawText = overrideText || input.value.trim();
        if (!rawText) return;

        // UI: User Message
        let displayHtml = rawText.replace(/\n/g, '<br>');
        if (rawText.includes('{') || rawText.includes(';') || rawText.includes('#include')) {
             displayHtml = `<pre>${rawText}</pre>`;
        }
        
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.innerHTML = displayHtml;
        messagesDiv.appendChild(userDiv);
        scrollToBottom();

        input.value = '';
        input.style.height = 'auto';
        input.disabled = true;
        sendBtn.disabled = true;

        // Context Logic
        let textToSend = rawText;
        if (activeChallenge) {
            textToSend = `[CONTEXT: User is solving Challenge: "${activeChallenge}"]\n\nUser Code:\n${rawText}`;
            activeChallenge = null; 
        }

        // UI: Bot Placeholder
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'message bot';
        // --- NEW: INITIAL HTML IS A PROGRESS BAR ---
        botMsgDiv.innerHTML = `
            <div class="progress-step-container" id="bot-progress-${Date.now()}">
                <div class="progress-step-text">
                    <span id="prog-text">Initializing...</span>
                    <span id="prog-pct">0%</span>
                </div>
                <div class="progress-step-track">
                    <div class="progress-step-fill" style="width: 5%"></div>
                </div>
            </div>
        `;
        // -------------------------------------------
        messagesDiv.appendChild(botMsgDiv);
        scrollToBottom();

        try {
            const response = await fetch(`${API_URL}/api/v1/chat/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: textToSend, 
                    user_role: currentUser.role,
                    username: currentUser.username
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            
            // Buffer for the full markdown text
            let currentMarkdown = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.trim() === '') continue;
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.type === 'status') {
                                // Update Intent Badge (Existing)
                                if(intentBadge) intentBadge.innerText = data.message;
                                
                                // --- NEW: UPDATE PROGRESS BAR ---
                                const fill = botMsgDiv.querySelector('.progress-step-fill');
                                const text = botMsgDiv.querySelector('#prog-text');
                                const pct = botMsgDiv.querySelector('#prog-pct');
                                
                                if (fill && data.percent) {
                                    fill.style.width = data.percent + "%";
                                    text.innerText = data.message;
                                    pct.innerText = data.percent + "%";
                                }
                                // -------------------------------
                            }
                            else if (data.type === 'token') {
                                // --- STREAMING TEXT ---
                                currentMarkdown += data.text;
                                botMsgDiv.innerHTML = marked.parse(currentMarkdown);
                                scrollToBottom();
                            }
                            else if (data.type === 'answer') {
                                // Fallback for non-streaming blocks (like "Hold On")
                                currentMarkdown = data.text;
                                botMsgDiv.innerHTML = marked.parse(currentMarkdown);
                            }
                            else if (data.type === 'complete') {
                                // --- FINAL POLISH PHASE ---
                                // 1. Render Final Markdown (Clean)
                                botMsgDiv.innerHTML = marked.parse(data.data.answer);
                                
                                // 2. Display Metadata
                                displaySources(data.data.sources);
                                if (data.data.suggestions && data.data.suggestions.length > 0) {
                                    displaySuggestions(data.data.suggestions, botMsgDiv);
                                }

                                // 3. Render Diagrams (Robust Selector)
                                // Look for code blocks that contain 'graph TD' content
                                const codeBlocks = botMsgDiv.querySelectorAll('code');
                                for (const block of codeBlocks) {
                                    const text = block.textContent.trim();
                                    if (text.startsWith('graph TD') || text.startsWith('graph LR')) {
                                        try {
                                            const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                                            const { svg } = await window.mermaid.render(id, text);
                                            const div = document.createElement('div');
                                            div.innerHTML = svg;
                                            div.style.textAlign = 'center';
                                            div.style.margin = '15px 0';
                                            
                                            // Replace the parent <pre> tag
                                            const pre = block.parentElement;
                                            if (pre.tagName === 'PRE') {
                                                pre.replaceWith(div);
                                            } else {
                                                block.replaceWith(div);
                                            }
                                        } catch (e) {
                                            console.error("Mermaid Render Error", e);
                                        }
                                    }
                                }

                                // 4. Highlight Code (Prism) - Run AFTER Mermaid replacement
                                Prism.highlightAllUnder(botMsgDiv);
                                scrollToBottom();
                            }
                        } catch (e) {
                            console.warn("JSON Parse Error", e);
                        }
                    }
                }
            }

        } catch (error) {
            botMsgDiv.innerHTML = "Connection error.";
            console.error(error);
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function displaySuggestions(suggestions, containerDiv) {
        const suggDiv = document.createElement('div');
        suggDiv.className = 'suggestions-container';

        suggestions.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'suggestion-btn';
            
            if (text.toLowerCase().startsWith('challenge')) {
                btn.classList.add('challenge');
                btn.innerText = "💪 " + text.replace('Challenge:', '').trim();
                btn.onclick = () => { suggDiv.remove(); handleChallengeClick(text); };
            } else {
                btn.innerText = text;
                btn.onclick = () => { suggDiv.remove(); sendMessage(text); };
            }
            suggDiv.appendChild(btn);
        });
        containerDiv.appendChild(suggDiv);
        scrollToBottom();
    }

    function handleChallengeClick(challengeText) {
        activeChallenge = challengeText.replace("💪 ", "").replace("Challenge:", "").trim();
        const acceptDiv = document.createElement('div');
        acceptDiv.className = 'message user';
        acceptDiv.innerText = "I accept: " + activeChallenge;
        messagesDiv.appendChild(acceptDiv);

        const botDiv = document.createElement('div');
        botDiv.className = 'message bot';
        botDiv.innerText = "Paste your code solution below!";
        messagesDiv.appendChild(botDiv);
        scrollToBottom();

        input.value = "// Write your C code here:\n\n";
        input.focus();
    }

    function displaySources(sources) {
        sourcesDiv.innerHTML = ''; 
        if (!sources || sources.length === 0) {
            sourcesDiv.innerHTML = '<div style="color:#888; text-align:center; margin-top:20px;">No sources found.</div>';
            return;
        }

        const uniqueSources = new Map();
        sources.forEach(s => uniqueSources.set(s.document_name, s));

        uniqueSources.forEach((source) => {
            const card = document.createElement('div');
            card.className = 'source-card';
            const isCode = source.document_name.endsWith('.c');
            const isRestricted = source.access_level === 'teacher';
            const icon = isRestricted ? '🔒' : (isCode ? '💻' : '📖');
            
            let contentHtml = source.chunk_text || "";
            if (isCode) contentHtml = `<pre><code class="language-c">${contentHtml.replace(/</g, '&lt;')}</code></pre>`;
            else contentHtml = marked.parse(contentHtml);

            card.innerHTML = `
                <div class="source-title" style="${isRestricted ? 'background:#ffecb3;' : ''}">
                    <span>${icon} ${source.document_name}</span>
                </div>
                <div class="source-content">${contentHtml}</div>
            `;
            sourcesDiv.appendChild(card);
        });
        Prism.highlightAllUnder(sourcesDiv);
    }

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Start App
    checkAuth();
    // Check session on load
    const stored = localStorage.getItem('c_tutor_user');
    if(stored) {
        currentUser = JSON.parse(stored);
        routeUser();
    }
</script>

</body>
</html>
